<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,minimal-ui,viewport-fit=cover">
    <meta name=apple-mobile-web-app-capable content=yes>
    <meta name=apple-mobile-web-app-status-bar-style content=black>
    <title>Bitwarden Get Settings</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/barraider/streamdeck-easypi@latest/src/sdpi.css">
    <!-- Shipped with the plugin rather than pulled from a CDN, so the picker still works
         offline. Awesomplete, MIT licensed. -->
    <link rel="stylesheet" href="awesomplete.base.css">
    <script src="https://cdn.jsdelivr.net/gh/barraider/streamdeck-easypi@latest/src/sdtools.common.js"></script>
    <script src="awesomplete.min.js"></script>
    <script src="Get.js"></script>
    <style>
        /* The search box and its clear button share the row's value area. Awesomplete
           inserts a wrapper div around the input which carries none of sdpi's sizing
           classes, hence the explicit flex here and on .awesomplete below. */
        .picker-row {
            align-items: stretch;
            display: flex;
            flex: 1 1 auto;
            gap: 4px;
            min-width: 0;
        }

        .awesomplete {
            flex: 1 1 auto;
            min-width: 0;
        }

        /* Match the height sdpi gives its own inputs and selects, which the wrapper would
           otherwise let the input choose for itself. */
        .picker-row input,
        .picker-row .picker-clear {
            box-sizing: border-box;
            font-size: 9pt;
            /* 26px is what sdpi gives its own selects; measured rather than guessed. */
            height: 26px;
            line-height: 24px;
            margin: 0;
        }

        .picker-row input {
            width: 100%;
        }

        .picker-row .picker-clear {
            background: #3d3d3d;
            border: 1px solid #666;
            border-radius: 3px;
            color: #969696;
            cursor: pointer;
            flex: 0 0 auto;
            padding: 0;
            text-align: center;
            width: 26px;
            /* sdpi.css sizes every button with !important, so matching the row's other
               controls needs the same. Only the height is forced. */
            height: 26px !important;
            min-height: 26px !important;
        }

        .picker-row .picker-clear:hover {
            background: #4d4d4d;
            color: #fff;
        }

        .picker-row .picker-clear:active {
            background: #0078d7;
            color: #fff;
        }

        /* The suggestion list is ours to style, which is the point of not using a
           datalist: entry names carry a username and the property inspector is narrow,
           so they have to wrap instead of being cut off. */
        .awesomplete > ul {
            background: #3d3d3d;
            border: 1px solid #666;
            border-radius: 3px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .5);
            margin: 2px 0 0;
            max-height: 260px;
            overflow-y: auto;
            padding: 0;
            text-shadow: none;
            width: 100%;
        }

        .awesomplete > ul > li {
            color: #d8d8d8;
            font-size: 9pt;
            line-height: 1.35;
            padding: 5px 8px;
            /* Show the entire entry, however long, rather than clipping it. */
            white-space: normal;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .awesomplete > ul > li:hover,
        .awesomplete > ul > li[aria-selected="true"] {
            background: #0078d7;
            color: #fff;
        }

        .awesomplete > ul > li mark {
            background: transparent;
            color: #7fd3ff;
            font-weight: bold;
        }

        .awesomplete > ul > li[aria-selected="true"] mark {
            background: transparent;
            color: #fff;
        }

        .awesomplete > ul:empty {
            display: none;
        }
    </style>
</head>
<body>
    <div class="sdpi-wrapper">
        <div class="sdpi-item" id="dvLoadItems">
            <div class="sdpi-item-label">Load Items</div>
            <button class="sdpi-item-value max20" onclick="requestItemLoad()">Load</button>
            <!-- Stamped by the Load button so the plugin can tell a deliberate reload from
                 an ordinary settings change. Never shown. -->
            <input type="hidden" class="sdProperty" id="loadtoken">
            <p>Load all available Items once (Unlock must be performed first), then type to
               search them.</p>
        </div>
        <div class="sdpi-item" id="dvSelectedItem">
            <div class="sdpi-item-label">Selected Item</div>
            <div class="picker-row">
                <input class="sdProperty" id="itemname" type="text"
                       placeholder="Type to search your vault..." autocomplete="off" oninput="setSettings()">
                <button class="picker-clear" id="clearitem" type="button" title="Clear"
                        onclick="clearItemSelection()">&#10005;</button>
            </div>
        </div>
        <div class="sdpi-item" id="dvSelectedInfo">
            <div class="sdpi-item-label">Selected Info</div>
            <select class="sdProperty" id="iteminformation" oninput="setSettings()">
                <option value="username">Username</option>
                <option value="password">Password</option>
                <option value="totp">TOTP</option>
                <option value="usernamepassword">Username+Password</option>
            </select>
        </div>
    </div>
</body>
</html>
